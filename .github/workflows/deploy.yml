name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Complete an active release before publishing the next commit.
concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  github-pages:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages-actions
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check GitHub Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" != "workflow" ]; then
            echo "::error::Choose GitHub Actions under repository Settings > Pages > Build and deployment > Source."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: npm test
        env:
          PAGES_TEST: "1"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  netlify:
    name: Netlify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check deployment credential
        env:
          BDP_NETLIFY_TOKEN: ${{ secrets.BDP_NETLIFY_TOKEN }}
        run: |
          if [ -z "$BDP_NETLIFY_TOKEN" ]; then
            echo "::error::Add the BDP_NETLIFY_TOKEN repository secret in GitHub Actions."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Publish tested build through Netlify preview and restore
        run: npm run deploy:netlify -- --skip-build
        env:
          BDP_NETLIFY_TOKEN: ${{ secrets.BDP_NETLIFY_TOKEN }}
