<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c1117" />
    <title>Merci — Béton Décoratif Provence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0c1117;
        color: #fff;
        font-family: "Inter Variable", system-ui, sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 30px;
      }
      main {
        max-width: 600px;
      }
      p {
        font-size: 15px;
        line-height: 1.8;
        color: #b8c0ca;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #d8a64b;
      }
      h1 {
        font-family: "Manrope Variable", system-ui, sans-serif;
        font-size: clamp(42px, 7vw, 65px);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1.1;
        margin: 24px 0;
      }
      a {
        display: inline-block;
        background: #d8a64b;
        color: #0c1117;
        text-decoration: none;
        padding: 18px 24px;
        font-size: 13px;
        font-weight: 700;
        border-radius: 4px;
        margin-top: 25px;
      }
      a:focus-visible {
        outline: 3px solid #d8a64b;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Béton Décoratif Provence</p>
      <h1>Merci pour<br />votre confiance.</h1>
      <p>
        Votre demande a été transmise. Nous pourrons échanger sur votre espace,
        vos envies et les matières qui vous inspirent.
      </p>
      <a href="%BASE_URL%">Revenir au site <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
